name: build

on:
  pull_request:
  push:
    branches: [master]

jobs:
  build:
    # Pinned: ubuntu-latest now resolves to ubuntu-26.04, and ruby/ruby-builder has no
    # Ruby 3.1 build for that image. Unpin once ruby-version is raised to a release that has one.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.1'
          bundler-cache: true

      - name: Build site
        run: bundle exec jekyll build --destination _site

      # Internal links only: external URLs across 150+ posts go stale for reasons
      # unrelated to a pull request, and would turn this into a flaky gate.
      - name: Check internal links
        run: |
          gem install html-proofer -v '~> 5.0'
          htmlproofer _site \
            --checks Links \
            --ignore-urls "/^https?:\/\//,/^mailto:/" \
            --assume-extension .html
